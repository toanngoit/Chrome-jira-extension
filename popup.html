<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jira Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" width="20" height="20" alt="">
    <h1>Jira Helper</h1>
  </header>

  <section>
    <label class="row">
      <span>Dim Dev Done items</span>
      <input type="checkbox" id="dimEnabled">
    </label>

    <div class="field">
      <div class="row">
        <label for="dimOpacity">Opacity</label>
        <span id="opacityValue" class="muted"></span>
      </div>
      <input type="range" id="dimOpacity" min="0.1" max="1" step="0.05">
    </div>

    <label class="row">
      <span>Full opacity on hover</span>
      <input type="checkbox" id="revealOnHover">
    </label>

    <div class="field">
      <label for="devDoneStatuses">Dev Done statuses <span class="muted">(one per line)</span></label>
      <textarea id="devDoneStatuses" rows="6" spellcheck="false"></textarea>
    </div>
  </section>

  <footer>
    <span id="saved" class="muted"></span>
    <button id="reset" type="button">Reset to defaults</button>
  </footer>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
