<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Jira Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" width="20" height="20" alt="">
    <h1>Jira Helper</h1>
  </header>

  <nav class="quick-nav" aria-label="Jira quick navigation">
    <button id="navHome" class="icon-btn" type="button"
            title="Open Jira home (Ctrl+click: new tab)" aria-label="Open Jira home">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
        <path fill="currentColor" d="M8 1.5 1 7.2l.9 1.1L3 7.4V14h4v-4h2v4h4V7.4l1.1.9.9-1.1L8 1.5Z"/>
      </svg>
    </button>
    <input id="navKey" type="text" placeholder="ARWF-9652 or 9652"
           autocomplete="off" spellcheck="false" autofocus
           title="Issue key or number. Enter: open here, Ctrl+Enter: new tab"
           aria-label="Issue key or number">
    <button id="navGo" class="icon-btn" type="button"
            title="Open issue (Ctrl+click: new tab)" aria-label="Open issue">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M3 8h9.5M8.5 4l4 4-4 4" fill="none" stroke="currentColor"
              stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </nav>

  <section>
    <div class="section-title">Choose what to do with work items:</div>

    <div class="row">
      <label class="check">
        <input type="checkbox" id="dimEnabled">
        <span>Dim work items</span>
      </label>
      <button id="dimToggle" class="chevron" type="button"
              aria-controls="dimOptions" aria-expanded="false" title="Show options">
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
          <path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <!-- Shown only while "Dim work items" is on and expanded via the chevron -->
    <div id="dimOptions" class="sub-options">
      <div class="field">
        <div class="row">
          <label for="dimOpacity">Opacity</label>
          <span id="opacityValue" class="muted"></span>
        </div>
        <input type="range" id="dimOpacity" min="0.1" max="1" step="0.05">
      </div>

      <label class="check">
        <input type="checkbox" id="revealOnHover">
        <span>Full opacity on hover</span>
      </label>
    </div>

    <label class="check">
      <input type="checkbox" id="hideEnabled">
      <span>Hide work items</span>
    </label>

    <div class="field">
      <div class="label-row">
        <label for="devDoneStatuses">…when the status is one of:</label>
        <span id="devDoneStatusesHint" class="info" tabindex="0" role="img"
              aria-label="Type each status on its own line, exactly as it appears in Jira. Upper/lower case doesn't matter. Leave empty to skip this rule."
              title="Type each status on its own line, exactly as it appears in Jira.&#10;Upper/lower case doesn't matter.&#10;Leave empty to skip this rule.">i</span>
      </div>
      <textarea id="devDoneStatuses" rows="4" spellcheck="false" aria-describedby="devDoneStatusesHint"></textarea>
    </div>

    <div class="field">
      <div class="label-row">
        <label for="assignees">…or the Assignee is one of:</label>
        <span id="assigneesHint" class="info" tabindex="0" role="img"
              aria-label="Type each person's name on its own line, as it appears in Jira's Assignee column. Whole words match, so Juan matches Juan Pérez, but Matt does not match Matthew. Upper/lower case doesn't matter. Leave empty to skip this rule."
              title="Type each person's name on its own line, as it appears in Jira's Assignee column.&#10;Whole words match: &quot;Juan&quot; matches &quot;Juan Pérez&quot;, but &quot;Matt&quot; does not match &quot;Matthew&quot;.&#10;Upper/lower case doesn't matter.&#10;Leave empty to skip this rule.">i</span>
      </div>
      <textarea id="assignees" rows="4" spellcheck="false" aria-describedby="assigneesHint"></textarea>
    </div>
  </section>

  <footer>
    <span id="saved" class="muted"></span>
    <div class="menu">
      <button type="button" id="menuButton" class="menu-button" title="More" aria-label="More"
              aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <circle cx="3" cy="8" r="1.4" fill="currentColor"/>
          <circle cx="8" cy="8" r="1.4" fill="currentColor"/>
          <circle cx="13" cy="8" r="1.4" fill="currentColor"/>
        </svg>
      </button>
      <div id="menu" class="menu-list" role="menu" aria-labelledby="menuButton" hidden>
        <button type="button" role="menuitem" data-action="reset">Reset to defaults</button>
        <button type="button" role="menuitem" data-action="about">About</button>
      </div>
    </div>
  </footer>

  <!-- Version and description are filled in from manifest.json -->
  <dialog id="aboutDialog" class="about" aria-labelledby="aboutTitle">
    <div class="about-header">
      <img src="icons/icon32.png" alt="" width="22" height="22">
      <h2 id="aboutTitle">Jira Helper</h2>
      <span id="aboutVersion" class="badge"></span>
    </div>
    <p id="aboutDescription"></p>
    <form method="dialog" class="about-actions">
      <button type="submit" class="primary-button">Close</button>
    </form>
  </dialog>

  <script src="config.js"></script>
  <script src="popup.js"></script>
  <script src="quicknav.js"></script>
</body>
</html>
